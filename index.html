<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DeutschTrainer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f172a; font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; padding: 16px; }
@keyframes xpburst {
  0% { opacity: 0; transform: translate(-50%,-60%) scale(0.7); }
  30% { opacity: 1; transform: translate(-50%,-70%) scale(1.2); }
  100% { opacity: 0; transform: translate(-50%,-90%) scale(1); }
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.card { background: #0f1f35; border-radius: 16px; padding: 20px; border: 1px solid #1e3a5f; width: 100%; max-width: 460px; margin: 0 auto; }
.btn-primary { display: block; width: 100%; background: #2563eb; color: #fff; border: none; border-radius: 12px; padding: 14px; font-weight: 800; font-size: 16px; cursor: pointer; font-family: 'Syne', sans-serif; text-align: center; }
.btn-secondary { display: block; width: 100%; background: transparent; color: #94a3b8; border: 2px solid #334155; border-radius: 12px; padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 10px; }
.btn-ghost { background: transparent; color: #60a5fa; border: none; cursor: pointer; font-weight: 600; font-size: 14px; padding: 4px; }
.option { display: block; width: 100%; background: #1e293b; border: 2px solid #334155; color: #cbd5e1; border-radius: 12px; padding: 13px 16px; text-align: left; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 10px; font-family: inherit; }
.option.selected { background: #1e3a5f; border-color: #3b82f6; color: #93c5fd; }
.option.correct { background: #14532d; border-color: #22c55e; color: #86efac; }
.option.wrong { background: #450a0a; border-color: #ef4444; color: #fca5a5; }
.feedback-good { background: #14532d; border: 1.5px solid #22c55e; color: #86efac; border-radius: 12px; padding: 12px 16px; font-size: 14px; margin-bottom: 12px; }
.feedback-bad { background: #450a0a; border: 1.5px solid #ef4444; color: #fca5a5; border-radius: 12px; padding: 12px 16px; font-size: 14px; margin-bottom: 12px; }
.explanation { background: #0f172a; border-radius: 12px; padding: 14px; font-size: 13px; color: #94a3b8; border-left: 3px solid #3b82f6; margin-bottom: 12px; line-height: 1.5; }
.progress-bar { background: #1e293b; border-radius: 99px; height: 10px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 99px; transition: width 0.5s; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 99px; margin-bottom: 14px; }
.xp-burst { position: fixed; top: 50%; left: 50%; font-size: 26px; font-weight: 900; color: #facc15; pointer-events: none; animation: xpburst 0.8s ease forwards; z-index: 999; font-family: 'Syne', sans-serif; text-shadow: 0 2px 16px #00000088; }
h1 { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 900; color: #f1f5f9; letter-spacing: -1px; }
h1 span { color: #3b82f6; }
.label { font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.question-box { background: #1e293b; border-radius: 14px; padding: 18px; margin-bottom: 18px; font-size: 17px; font-weight: 700; color: #f1f5f9; line-height: 1.5; font-family: 'Syne', sans-serif; }
.stat-box { flex: 1; background: #1e293b; border-radius: 12px; padding: 10px 0; text-align: center; }
.stat-val { font-size: 20px; font-weight: 900; font-family: 'Syne', sans-serif; }
.stat-label { font-size: 11px; color: #64748b; margin-top: 2px; }
.level-btn { flex: 1; padding: 10px 4px; border-radius: 10px; border: 2px solid #1e293b; background: #1e293b; color: #475569; font-weight: 700; font-size: 13px; cursor: pointer; font-family: 'Syne', sans-serif; text-align: center; }
.level-btn.active { border-color: #3b82f6; background: #1d3557; color: #93c5fd; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const XP_PER_CORRECT = 15;
const XP_LEVEL_UP = 100;

const QUESTIONS = [
  // På restaurant / café
  { type:"mc", topic:"På restaurant", question:"Du vil gerne have regningen. Hvad siger du?", options:["Ich hätte gerne die Rechnung, bitte.","Geben Sie mir Geld!","Ich will bezahlen jetzt.","Können Sie mir helfen?"], correct:0, explanation:"'Ich hätte gerne' er den høflige form. Man hører også bare 'Die Rechnung, bitte!' som er endnu kortere og meget brugt." },
  { type:"mc", topic:"På restaurant", question:"Tjeneren spørger: 'Hat es geschmeckt?' Hvad spørger han om?", options:["Om du vil have dessert","Om det smagte godt","Om du vil have regningen","Om du er klar til at bestille"], correct:1, explanation:"'Hat es geschmeckt?' betyder bogstaveligt 'Har det smagt?' — helt standard sætning fra tjenere i tysktalende lande." },
  { type:"mc", topic:"På café", question:"Du vil gerne have en kaffe med mælk. Hvad siger du?", options:["Einen Kaffee mit Milch, bitte.","Ein Kaffee, danke.","Ich möchte Tee.","Haben Sie Wasser?"], correct:0, explanation:"'Einen Kaffee' — hankøn i akkusativ. 'mit Milch' tilføjes direkte. Simpelt og naturligt." },
  { type:"mc", topic:"På café", question:"Hvad betyder 'Zum hier trinken oder zum Mitnehmen?'", options:["Vil du have is i din kaffe?","Drikker du her eller tager du med?","Vil du have stor eller lille?","Hvad vil du gerne have?"], correct:1, explanation:"Det klassiske spørgsmål ved kassen — svarene er 'Hier, bitte' eller 'Zum Mitnehmen'." },

  // Smalltalk
  { type:"mc", topic:"Smalltalk", question:"En kollega siger 'Na, wie läuft's?' Hvad mener han?", options:["Hvordan løber du?","Hvad sker der / hvordan går det?","Skal vi gå en tur?","Hvornår holder du pause?"], correct:1, explanation:"'Na, wie läuft's?' er meget uformel hverdagssnak — svarene er fx 'Gut, danke!' eller 'Ja, geht so...'." },
  { type:"mc", topic:"Smalltalk", question:"Hvad svarer man naturligt på 'Alles klar?'", options:["Nein, ich bin krank.","Ja, alles klar!","Ich verstehe nicht.","Bitte wiederholen Sie."], correct:1, explanation:"'Alles klar?' bruges som 'Alt godt?' og svaret er typisk bare 'Ja, alles klar!' eller 'Ja, danke!'." },
  { type:"mc", topic:"Smalltalk", question:"Hvad betyder udtrykket 'Das geht klar'?", options:["Det er klart vejr","Det er i orden / det fikser jeg","Det er svært","Det er ikke muligt"], correct:1, explanation:"Meget brugt i hverdagssprog — betyder 'det ordner sig' eller 'no problem'. Fx 'Kannst du das machen?' - 'Ja, geht klar!'." },
  { type:"mc", topic:"Smalltalk", question:"Du møder en nabo og vil sige 'Vi ses!' Hvad siger du?", options:["Auf Wiedersehen!","Bis später!","Tschüss, bis dann!","Alle tre virker"], correct:3, explanation:"Alle tre er korrekte. 'Tschüss' er mest uformelt og hyppigt brugt i hverdagen. 'Auf Wiedersehen' er mere formelt." },

  // Transport
  { type:"mc", topic:"Transport", question:"Du vil købe en billet til Berlin. Hvad siger du i skranken?", options:["Berlin, bitte.","Einmal nach Berlin, bitte.","Ich fahre Berlin.","Ein Ticket Berlin kaufen."], correct:1, explanation:"'Einmal nach Berlin, bitte' — 'einmal' (en gang/én billet) + 'nach' (til by). Super praktisk formel." },
  { type:"mc", topic:"Transport", question:"Skiltene viser 'Gleis 7'. Hvad betyder det?", options:["Terminal 7","Perron/spor 7","Gate 7","Udgang 7"], correct:1, explanation:"'Gleis' er det tyske ord for perron eller spor — vigtigt at kende på tyske banegårde." },
  { type:"mc", topic:"Transport", question:"'Der Zug hat 20 Minuten Verspätung.' Hvad sker der?", options:["Toget er aflyst","Toget er 20 minutter forsinket","Toget afgår om 20 minutter","Toget er fuldt"], correct:1, explanation:"'Verspätung' = forsinkelse. Meget brugt i tyske togansøgelser, desværre." },
  { type:"mc", topic:"Transport", question:"Du vil spørge om toget til München holder her. Hvad siger du?", options:["Fährt hier der Zug nach München?","München Zug hier?","Ist München weit?","Wo ist der Bahnhof?"], correct:0, explanation:"'Fährt hier der Zug nach München?' — 'fährt' (kører/afgår), 'hier' (her), 'nach München' (til München)." },

  // Indkøb
  { type:"mc", topic:"Indkøb", question:"Du vil spørge hvad noget koster. Hvad siger du?", options:["Wie viel kostet das?","Was ist der Preis?","Haben Sie das billiger?","Ich möchte das kaufen."], correct:0, explanation:"'Wie viel kostet das?' er den mest naturlige måde. Man hører også 'Was kostet das?' — begge er korrekte." },
  { type:"mc", topic:"Indkøb", question:"Ekspedienten spørger 'Kann ich Ihnen helfen?' Hvad vil hun?", options:["Kan hun låne noget af dig?","Kan hun hjælpe dig med noget?","Hvad vil du gerne have?","Er du tilfreds?"], correct:1, explanation:"'Kann ich Ihnen helfen?' = 'Kan jeg hjælpe dig?' — standard hilsen fra butiksansatte. Svar: 'Ja, ich suche...' eller 'Nein danke, ich schaue nur'." },
  { type:"mc", topic:"Indkøb", question:"Du vil bare kigge. Hvad siger du?", options:["Ich kaufe nichts.","Ich schaue mich nur um, danke.","Nein, gehen Sie weg.","Ich brauche keine Hilfe, bitte."], correct:1, explanation:"'Ich schaue mich nur um' = 'Jeg kigger bare'. Høflig og meget brugt." },

  // Vejr
  { type:"mc", topic:"Vejret", question:"'Es regnet in Strömen' — hvad siger det om vejret?", options:["Det drypper lidt","Det øser ned","Det er overskyet","Det blæser kraftigt"], correct:1, explanation:"'In Strömen regnen' = 'øse ned'. Et fast udtryk — bogstaveligt 'det regner i strømme'." },
  { type:"mc", topic:"Vejret", question:"Hvad betyder 'Heute ist es bewölkt'?", options:["Det er solskin","Det er overskyet","Det er koldt","Det er tåget"], correct:1, explanation:"'Bewölkt' = overskyet. Andre nyttige vejrord: 'sonnig' (solrigt), 'windig' (blæsende), 'neblig' (tåget)." },

  // Arbejde
  { type:"mc", topic:"På arbejdet", question:"Din kollega siger 'Ich bin gleich zurück.' Hvad mener han?", options:["Han er ikke der","Han kommer straks tilbage","Han er sent på den","Han er gået for dagen"], correct:1, explanation:"'Gleich' = straks/om lidt. 'Ich bin gleich zurück' = 'Jeg er tilbage om et øjeblik'." },
  { type:"mc", topic:"På arbejdet", question:"Du vil sige at du er syg og ikke kan komme. Hvad siger du?", options:["Ich bin müde.","Ich bin krank und kann leider nicht kommen.","Ich komme später.","Es tut mir leid, ich bin beschäftigt."], correct:1, explanation:"'Krank' = syg. 'Leider' = desværre. Vigtigt at have med for at lyde høflig." },
  { type:"mc", topic:"På arbejdet", question:"Hvad betyder 'Das haben wir so nicht besprochen'?", options:["Det har vi ikke diskuteret på den måde","Det kan vi ikke lave om","Det er ikke mit ansvar","Det er et godt forslag"], correct:0, explanation:"'Besprechen' = at diskutere/aftale. Sætningen bruges når man er uenig om hvad der blev aftalt." },

  // Hotel
  { type:"mc", topic:"Hotel", question:"Du vil gerne tjekke ind. Hvad siger du i receptionen?", options:["Ich habe eine Reservierung auf den Namen...","Ich brauche ein Zimmer.","Haben Sie Platz?","Wo ist mein Zimmer?"], correct:0, explanation:"'Ich habe eine Reservierung auf den Namen...' = 'Jeg har en reservation i navnet...' — den klassiske indcheckning." },
  { type:"mc", topic:"Hotel", question:"'Das Zimmer geht zur Straße' — hvad betyder det?", options:["Rummet er tæt på udgangen","Rummet vender ud mod gaden","Rummet er meget stort","Rummet har ikke bad"], correct:1, explanation:"'Zur Straße gehen' = vende ud mod gaden (og typisk være mere støjende). Modsat: 'zum Innenhof' (mod gårdhaven)." },

  // Ret fejlen
  { type:"ec", topic:"Typisk fejl", wrong:"Ich bin 30 Jahre jung.", options:["Ich bin 30 Jahre jung.","Ich bin 30 Jahre alt.","Ich habe 30 Jahre alt.","Ich bin jung 30 Jahre."], correct:1, explanation:"På dansk siger vi 'ung', men på tysk bruger man altid 'alt' (gammel) om alder — 'Ich bin 30 Jahre alt'." },
  { type:"ec", topic:"Typisk fejl", wrong:"Ich vermisse dich sehr viel.", options:["Ich vermisse dich sehr viel.","Ich vermisse dich sehr.","Ich misse dich sehr.","Ich savne dich sehr."], correct:1, explanation:"'Sehr viel' (meget meget) bruges ikke med 'vermissen'. Det hedder bare 'Ich vermisse dich sehr'." },
  { type:"ec", topic:"Typisk fejl", wrong:"Das Wetter ist sehr schön heute.", options:["Das Wetter ist sehr schön heute.","Heute ist das Wetter sehr schön.","Das Wetter heute ist sehr schön.","Schön ist das Wetter heute sehr."], correct:1, explanation:"Når man starter med et tidsudtryk som 'heute', skal verbet stadig stå på 2. plads: 'Heute IST das Wetter...'." },
  { type:"ec", topic:"Typisk fejl", wrong:"Ich bin seit drei Jahren hier wohnen.", options:["Ich bin seit drei Jahren hier wohnen.","Ich wohne seit drei Jahren hier.","Ich habe seit drei Jahren hier gewohnt.","Ich wohne hier seit drei Jahre."], correct:1, explanation:"Igangværende handlinger der stadig sker bruges præsens på tysk: 'Ich WOHNE seit drei Jahren hier' — ikke perfektum som på dansk." },
  { type:"ec", topic:"Typisk fejl", wrong:"Kannst du mich rufen zurück?", options:["Kannst du mich rufen zurück?","Kannst du mich zurückrufen?","Kannst du zurück mich rufen?","Kannst du mich zurück rufen?"], correct:1, explanation:"'Zurückrufen' er et separabelt verbum — præfikset 'zurück' hænger normalt sammen med 'rufen'." },
  { type:"ec", topic:"Typisk fejl", wrong:"Ich freue mich auf dich zu sehen.", options:["Ich freue mich auf dich zu sehen.","Ich freue mich, dich zu sehen.","Ich freue mich dich sehen.","Ich freue mich um dich zu sehen."], correct:1, explanation:"'Freuen auf' bruges om fremtidige begivenheder. Her er det nu, så det er 'Ich freue mich, dich zu sehen' — med komma og uden 'auf'." },
  { type:"ec", topic:"Typisk fejl", wrong:"Das macht Sinn.", options:["Das macht Sinn.","Das ergibt Sinn.","Das gibt Sinn.","Das hat Sinn."], correct:1, explanation:"Direkte oversættelse fra engelsk/dansk fælder mange. På tysk hedder det 'Das ergibt Sinn' — 'macht Sinn' er en anglicisme der breder sig, men stadig anses som forkert." },
  { type:"ec", topic:"Typisk fejl", wrong:"Ich bin einverstanden mit du.", options:["Ich bin einverstanden mit du.","Ich bin einverstanden mit dir.","Ich bin einverstanden mit dich.","Ich bin einverstanden mit Sie."], correct:1, explanation:"Efter præpositioner som 'mit' bruges dativ: 'dir' (ikke 'du'). 'Mit dir' = 'med dig'." },
];

let state = {
  screen: "home",
  level: "B1",
  xp: 0,
  streak: 0,
  hearts: 5,
  sessionCorrect: 0,
  sessionTotal: 0,
  current: null,
  selected: null,
  revealed: false,
  feedback: null,
  showXP: false,
  usedIndices: [],
};

function getNextQuestion() {
  if (state.usedIndices.length >= QUESTIONS.length) state.usedIndices = [];
  let idx;
  do { idx = Math.floor(Math.random() * QUESTIONS.length); } while (state.usedIndices.includes(idx));
  state.usedIndices.push(idx);
  return { ...QUESTIONS[idx], idx };
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  if (state.showXP) {
    const burst = document.createElement("div");
    burst.className = "xp-burst";
    burst.textContent = `+${XP_PER_CORRECT} XP`;
    app.appendChild(burst);
  }

  if (state.screen === "levelup") {
    app.innerHTML += `
      <div class="card" style="text-align:center;padding:40px 20px;margin-top:40px">
        <div style="font-size:60px;margin-bottom:16px">🏆</div>
        <div style="font-family:'Syne',sans-serif;font-size:28px;font-weight:900;color:#facc15;margin-bottom:8px">Level ${Math.floor(state.xp/XP_LEVEL_UP)+1}!</div>
        <div style="color:#94a3b8;margin-bottom:28px">Du er rykket op. Fortsæt det gode arbejde.</div>
        <button class="btn-primary" onclick="goHome()">Fortsæt</button>
      </div>`;
    return;
  }

  if (state.screen === "home") {
    const lvl = Math.floor(state.xp / XP_LEVEL_UP) + 1;
    const xpInLevel = state.xp % XP_LEVEL_UP;
    const acc = state.sessionTotal > 0 ? Math.round(state.sessionCorrect/state.sessionTotal*100) : 0;
    const statsHTML = state.sessionTotal > 0 ? `
      <div style="display:flex;gap:10px;margin-bottom:22px">
        <div class="stat-box"><div class="stat-val">${state.sessionTotal}</div><div class="stat-label">Øvelser</div></div>
        <div class="stat-box"><div class="stat-val" style="color:#22c55e">${state.sessionCorrect}</div><div class="stat-label">Korrekte</div></div>
        <div class="stat-box"><div class="stat-val" style="color:${acc>70?'#22c55e':'#f59e0b'}">${acc}%</div><div class="stat-label">Præcision</div></div>
      </div>` : "";

    app.innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
          <div>
            <h1>Deutsch<span>Trainer</span></h1>
            <div style="color:#64748b;font-size:13px">Hverdagstysk med AI</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
            <span style="color:#ef4444;font-weight:700;font-size:15px">🔥${state.streak}</span>
            <span style="color:#ef4444;font-size:18px;letter-spacing:-1px">${'❤️'.repeat(state.hearts)}${'🖤'.repeat(5-state.hearts)}</span>
          </div>
        </div>

        <div style="margin-bottom:24px">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-bottom:6px">
            <span style="font-weight:700;color:#94a3b8">Level ${lvl}</span>
            <span>${xpInLevel} / ${XP_LEVEL_UP} XP</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${xpInLevel}%;background:#3b82f6"></div></div>
        </div>

        ${statsHTML}

        <div style="margin-bottom:22px">
          <div class="label">Sværhedsgrad</div>
          <div style="display:flex;gap:8px">
            ${["A2","B1","B2","C1"].map(l => `<button class="level-btn ${state.level===l?'active':''}" onclick="setLevel('${l}')">${l}<br><span style="font-size:10px;font-weight:400">${{A2:'Grundlæg.',B1:'Mellem',B2:'Øvet',C1:'Avanceret'}[l]}</span></button>`).join("")}
          </div>
        </div>

        <button class="btn-primary" onclick="startExercise()" ${state.hearts===0?'disabled style="opacity:0.4"':''}>
          ${state.hearts===0?"❤️ Ingen liv tilbage":"Start øvelse →"}
        </button>
        ${state.hearts===0?'<button class="btn-secondary" onclick="refillHearts()">Genopfyld liv</button>':""}
      </div>`;
    return;
  }

  if (state.screen === "exercise") {
    const q = state.current;
    if (!q) { app.innerHTML = '<div class="card"><div style="color:#fca5a5;text-align:center;padding:32px">Fejl. <button class="btn-ghost" onclick="startExercise()">Prøv igen</button></div></div>'; return; }

    const optionsHTML = q.options.map((opt, i) => {
      let cls = "option";
      if (state.revealed) {
        if (i === q.correct) cls += " correct";
        else if (i === state.selected) cls += " wrong";
      } else if (i === state.selected) cls += " selected";
      return `<button class="${cls}" onclick="selectOption(${i})" ${state.revealed?"disabled":""}><span style="opacity:0.5;margin-right:8px">${["A","B","C","D"][i]}</span>${opt}</button>`;
    }).join("");

    const feedbackHTML = state.feedback === "correct"
      ? `<div class="feedback-good">✓ Korrekt!</div>`
      : state.feedback === "wrong" ? `<div class="feedback-bad">✗ Forkert.</div>` : "";

    const actionHTML = !state.revealed
      ? `<button class="btn-primary" onclick="checkAnswer()" ${state.selected===null?'disabled style="opacity:0.4"':''}>Tjek svar</button>`
      : `${q.explanation?`<div class="explanation">💬 ${q.explanation}</div>`:""}
         <button class="btn-primary" onclick="startExercise()">Næste øvelse →</button>`;

    const wrongBox = q.type === "ec" ? `<div class="question-box" style="color:#fca5a5;font-style:italic">${q.wrong}</div>` : "";
    const questionBox = q.type === "mc" ? `<div class="question-box">${q.question}</div>` : "";

    app.innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
          <button class="btn-ghost" onclick="goHome()">← Tilbage</button>
          <span style="color:#ef4444;font-size:16px;letter-spacing:-1px">${'❤️'.repeat(state.hearts)}${'🖤'.repeat(5-state.hearts)}</span>
          <span style="color:#facc15;font-weight:700">🔥${state.streak}</span>
        </div>

        <div style="margin-bottom:14px">
          <span class="badge" style="background:#1e3a5f;color:#60a5fa">${q.topic}</span>
          ${q.type==="ec"?'<span class="badge" style="background:#2d1a4a;color:#c4b5fd;margin-left:6px">Ret fejlen</span>':""}
        </div>

        <div class="label">${q.type==="mc"?"Vælg det rigtige svar":"Find og ret fejlen"}</div>
        ${questionBox}${wrongBox}
        ${optionsHTML}
        ${feedbackHTML}
        ${actionHTML}
      </div>`;
  }
}

function goHome() { state.screen = "home"; render(); }
function setLevel(l) { state.level = l; render(); }
function refillHearts() { state.hearts = 5; render(); }

function startExercise() {
  state.current = getNextQuestion();
  state.selected = null;
  state.revealed = false;
  state.feedback = null;
  state.screen = "exercise";
  render();
}

function selectOption(i) {
  if (state.revealed) return;
  state.selected = i;
  render();
}

function checkAnswer() {
  if (state.selected === null || state.revealed) return;
  state.revealed = true;
  state.sessionTotal++;
  if (state.selected === state.current.correct) {
    state.feedback = "correct";
    state.sessionCorrect++;
    state.streak++;
    const newXp = state.xp + XP_PER_CORRECT;
    state.xp = newXp;
    state.showXP = true;
    render();
    setTimeout(() => {
      state.showXP = false;
      if (Math.floor(newXp/XP_LEVEL_UP) > Math.floor((newXp-XP_PER_CORRECT)/XP_LEVEL_UP)) {
        state.screen = "levelup";
      }
      render();
    }, 900);
  } else {
    state.feedback = "wrong";
    state.streak = 0;
    state.hearts = Math.max(0, state.hearts - 1);
    render();
  }
}

render();
</script>
</body>
</html>
