<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeutschTrainer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f172a; font-family: 'IBM Plex Sans', sans-serif; }
@keyframes xpburst {
  0% { opacity: 0; transform: translate(-50%, -60%) scale(0.7); }
  30% { opacity: 1; transform: translate(-50%, -70%) scale(1.2); }
  100% { opacity: 0; transform: translate(-50%, -90%) scale(1); }
}
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
  40% { transform: scale(1); opacity: 1; }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
input::placeholder { color: #334155; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;

const LEVELS = [
  { id: "A2", label: "A2", desc: "Grundlæggende" },
  { id: "B1", label: "B1", desc: "Mellemniveau" },
  { id: "B2", label: "B2", desc: "Øvet" },
  { id: "C1", label: "C1", desc: "Avanceret" },
];

const XP_PER_CORRECT = 15;
const XP_LEVEL_UP = 100;
const EXERCISE_TYPES = ["multiple_choice","multiple_choice","multiple_choice","multiple_choice","pronunciation","pronunciation","error_correction"];

function ProgressBar({ value, max, color = "#22c55e" }) {
  const pct = Math.min(100, (value / max) * 100);
  return (
    <div style={{ background: "#1e293b", borderRadius: 99, height: 10, overflow: "hidden" }}>
      <div style={{ width: `${pct}%`, height: "100%", background: color, borderRadius: 99, transition: "width 0.5s cubic-bezier(.4,0,.2,1)" }} />
    </div>
  );
}

function HeartIcon({ filled }) {
  return (
    <svg width="22" height="22" viewBox="0 0 24 24" fill={filled ? "#ef4444" : "none"} stroke={filled ? "#ef4444" : "#475569"} strokeWidth="2">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
    </svg>
  );
}

function XPBurst({ show }) {
  return show ? (
    <div style={{
      position: "fixed", top: "50%", left: "50%", transform: "translate(-50%,-60%)",
      fontSize: 28, fontWeight: 900, color: "#facc15", pointerEvents: "none",
      animation: "xpburst 0.8s ease forwards", zIndex: 999,
      textShadow: "0 2px 16px #00000088", fontFamily: "'Syne', sans-serif"
    }}>+{XP_PER_CORRECT} XP</div>
  ) : null;
}

function LoadingDots() {
  return (
    <div style={{ display: "flex", gap: 6, justifyContent: "center", padding: "32px 0" }}>
      {[0,1,2].map(i => (
        <div key={i} style={{ width: 10, height: 10, borderRadius: "50%", background: "#3b82f6", animation: `bounce 1.2s ${i*0.2}s infinite` }} />
      ))}
    </div>
  );
}

function scoreMatch(spoken, target) {
  const norm = s => s.toLowerCase().replace(/[.,!?;:'"]/g,"").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").trim();
  const a = norm(spoken);
  const b = norm(target);
  if (a === b) return 1;
  const wa = new Set(a.split(/\s+/));
  const wb = new Set(b.split(/\s+/));
  let hits = 0;
  wb.forEach(w => { if (wa.has(w)) hits++; });
  return hits / wb.size;
}

function PronunciationExercise({ exercise, onCorrect, onWrong }) {
  const [status, setStatus] = useState("idle");
  const [transcript, setTranscript] = useState("");
  const [score, setScore] = useState(null);
  const [error, setError] = useState("");
  const recognizerRef = useRef(null);

  const hasSpeechAPI = typeof window !== "undefined" && ("SpeechRecognition" in window || "webkitSpeechRecognition" in window);

  function speakTarget() {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(exercise.phrase);
    u.lang = "de-DE"; u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }

  function startListening() {
    if (!hasSpeechAPI) { setError("Talegenkendelse virker kun i Chrome. Åbn siden i Chrome."); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.lang = "de-DE"; rec.interimResults = false; rec.maxAlternatives = 3;
    recognizerRef.current = rec;
    rec.onstart = () => setStatus("listening");
    rec.onresult = (e) => {
      let best = "", bestScore = -1;
      for (let i = 0; i < e.results[0].length; i++) {
        const alt = e.results[0][i].transcript;
        const sc = scoreMatch(alt, exercise.phrase);
        if (sc > bestScore) { bestScore = sc; best = alt; }
      }
      setTranscript(best); setScore(bestScore); setStatus("done");
      if (bestScore >= 0.75) onCorrect(); else onWrong();
    };
    rec.onerror = (e) => {
      setStatus("idle");
      if (e.error === "not-allowed") setError("Mikrofon-adgang nægtet. Tillad adgang i Chrome.");
      else if (e.error === "no-speech") setError("Ingen tale registreret. Prøv igen.");
      else setError("Fejl: " + e.error);
    };
    rec.start();
  }

  function stopListening() { recognizerRef.current?.stop(); setStatus("idle"); }

  const scoreColor = score === null ? "#64748b" : score >= 0.75 ? "#22c55e" : score >= 0.4 ? "#f59e0b" : "#ef4444";
  const scoreLabel = score === null ? "" : score >= 0.75 ? "Godt udtalt! ✓" : score >= 0.4 ? "Næsten — prøv igen" : "Prøv igen";

  return (
    <div>
      <div style={{ background: "#1e293b", borderRadius: 14, padding: 20, marginBottom: 16, textAlign: "center" }}>
        <div style={{ fontSize: 13, color: "#475569", marginBottom: 8, textTransform: "uppercase", letterSpacing: 1, fontWeight: 600 }}>Sig denne sætning på tysk</div>
        <div style={{ fontSize: 22, fontWeight: 900, color: "#f1f5f9", fontFamily: "'Syne', sans-serif", lineHeight: 1.4, marginBottom: 8 }}>{exercise.phrase}</div>
        {exercise.translation && <div style={{ fontSize: 14, color: "#64748b" }}>({exercise.translation})</div>}
        <button onClick={speakTarget} style={{ marginTop: 12, background: "#1e3a5f", border: "none", borderRadius: 8, padding: "8px 18px", color: "#93c5fd", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
          🔊 Hør udtalen
        </button>
      </div>

      {exercise.tip && status === "idle" && !score && (
        <div style={{ fontSize: 13, color: "#64748b", marginBottom: 14, padding: "10px 14px", background: "#0f172a", borderRadius: 10, borderLeft: "3px solid #3b82f6" }}>
          💡 {exercise.tip}
        </div>
      )}

      {!hasSpeechAPI && (
        <div style={{ color: "#fca5a5", fontSize: 13, marginBottom: 16, textAlign: "center" }}>
          ⚠️ Åbn siden i Chrome for at bruge mikrofonen.
        </div>
      )}

      {hasSpeechAPI && status !== "done" && (
        <button onClick={status === "listening" ? stopListening : startListening} style={{
          width: "100%", padding: "18px", borderRadius: 14, border: "none", cursor: "pointer",
          background: status === "listening" ? "#7f1d1d" : "#1e3a5f",
          color: status === "listening" ? "#fca5a5" : "#93c5fd",
          fontWeight: 800, fontSize: 16, fontFamily: "'Syne', sans-serif",
          animation: status === "listening" ? "pulse 1s infinite" : "none",
        }}>
          {status === "listening" ? "🎙️ Lytter… (tryk for at stoppe)" : "🎤 Tryk og tal"}
        </button>
      )}

      {status === "done" && transcript && (
        <div style={{ marginTop: 16 }}>
          <div style={{ background: "#1e293b", borderRadius: 12, padding: 14, marginBottom: 12 }}>
            <div style={{ fontSize: 12, color: "#475569", marginBottom: 4 }}>Du sagde:</div>
            <div style={{ fontSize: 16, color: "#e2e8f0", fontStyle: "italic" }}>"{transcript}"</div>
          </div>
          <div style={{ textAlign: "center", fontSize: 18, fontWeight: 900, color: scoreColor, fontFamily: "'Syne', sans-serif", marginBottom: 8 }}>{scoreLabel}</div>
          <ProgressBar value={Math.round((score || 0) * 100)} max={100} color={scoreColor} />
        </div>
      )}
      {error && <div style={{ color: "#fca5a5", fontSize: 13, marginTop: 12, textAlign: "center" }}>{error}</div>}
    </div>
  );
}

function buildPrompt(type, lvl) {
  const ctx = `Niveau: ${lvl}. Fokus: hverdagstysk — caféer, transport, indkøb, vejret, smalltalk, restaurant, rejser, arbejde, telefon. Naturligt talesprog. Ingen akademisk grammatikteori.`;
  if (type === "multiple_choice") return `${ctx}\n\nLav én multiple choice øvelse — situationsbaseret. Fx hvad siger man i denne situation, hvad betyder dette udtryk, hvad svarer man naturligt.\n\nReturner KUN valid JSON:\n{ "question": "...", "options": ["A","B","C","D"], "correct": 0, "explanation": "forklaring på dansk + evt. kulturelt tip", "topic": "situationsemne fx 'På café'" }`;
  if (type === "pronunciation") return `${ctx}\n\nLav én udtaleøvelse med en kort naturlig tysk hverdagssætning eller fast udtryk (max 8 ord). Noget hyppigt brugt.\n\nReturner KUN valid JSON:\n{ "phrase": "tysk sætning", "translation": "dansk oversættelse", "tip": "kort udtale-tip på dansk", "topic": "situationsemne" }`;
  if (type === "error_correction") return `${ctx}\n\nSkriv en naturlig tysk hverdagssætning med én typisk fejl danskere laver. Lav 4 svarmuligheder.\n\nReturner KUN valid JSON:\n{ "wrong": "sætning med fejl", "options": ["A","B","C","D"], "correct": 0, "error_type": "fejltype", "explanation": "forklaring på dansk", "topic": "situationsemne" }`;
}

function App() {
  const [screen, setScreen] = useState("home");
  const [level, setLevel] = useState("B1");
  const [xp, setXp] = useState(0);
  const [streak, setStreak] = useState(0);
  const [hearts, setHearts] = useState(5);
  const [exercise, setExercise] = useState(null);
  const [loading, setLoading] = useState(false);
  const [selected, setSelected] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [showXP, setShowXP] = useState(false);
  const [sessionCorrect, setSessionCorrect] = useState(0);
  const [sessionTotal, setSessionTotal] = useState(0);
  const [feedback, setFeedback] = useState(null);
  const [pronDone, setPronDone] = useState(false);

  const levelIndex = Math.floor(xp / XP_LEVEL_UP) + 1;
  const accuracy = sessionTotal > 0 ? Math.round((sessionCorrect / sessionTotal) * 100) : 0;

  async function fetchExercise() {
    setLoading(true); setRevealed(false); setSelected(null); setFeedback(null); setExercise(null); setPronDone(false);
    setScreen("exercise");
    const type = EXERCISE_TYPES[Math.floor(Math.random() * EXERCISE_TYPES.length)];
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514", max_tokens: 800,
          system: "Du er en praktisk tysk sproglærer. Svar KUN med valid JSON. Ingen forklaringer, ingen markdown, ingen backticks.",
          messages: [{ role: "user", content: buildPrompt(type, level) }],
        }),
      });
      const data = await res.json();
      const raw = data.content.map(b => b.text || "").join("");
      const parsed = JSON.parse(raw.replace(/```json|```/g,"").trim());
      setExercise({ ...parsed, type });
    } catch(e) { setExercise({ error: true }); }
    setLoading(false);
  }

  function checkAnswer() {
    if (!exercise || revealed) return;
    setRevealed(true); setSessionTotal(t => t+1);
    if (selected === exercise.correct) handleCorrect(); else handleWrong();
  }

  function handleCorrect() {
    setFeedback("correct"); setSessionCorrect(c => c+1); setStreak(s => s+1);
    const newXp = xp + XP_PER_CORRECT; setXp(newXp);
    setShowXP(true); setTimeout(() => setShowXP(false), 900);
    if (Math.floor(newXp / XP_LEVEL_UP) > Math.floor(xp / XP_LEVEL_UP)) setTimeout(() => setScreen("levelup"), 1000);
  }

  function handleWrong() { setFeedback("wrong"); setStreak(0); setHearts(h => Math.max(0, h-1)); }
  function handlePronCorrect() { setSessionTotal(t => t+1); setPronDone(true); handleCorrect(); }
  function handlePronWrong() { setSessionTotal(t => t+1); setPronDone(true); handleWrong(); }

  const s = {
    outer: { minHeight: "100vh", background: "#0f172a", display: "flex", justifyContent: "center", alignItems: "flex-start", padding: "24px 16px 48px" },
    card: { width: "100%", maxWidth: 480, background: "#0f1f35", borderRadius: 20, padding: 24, border: "1px solid #1e3a5f", boxShadow: "0 8px 48px #00000066" },
    btnPrimary: { width: "100%", background: "#2563eb", color: "#fff", border: "none", borderRadius: 12, padding: "14px 24px", fontWeight: 800, fontSize: 15, cursor: "pointer", fontFamily: "'Syne', sans-serif" },
    btnSecondary: { width: "100%", background: "transparent", color: "#94a3b8", border: "2px solid #334155", borderRadius: 12, padding: "12px 20px", fontWeight: 700, fontSize: 14, cursor: "pointer" },
    btnGhost: { background: "transparent", color: "#60a5fa", border: "none", cursor: "pointer", fontWeight: 600, fontSize: 14, padding: 4 },
    feedbackGood: { background: "#14532d", border: "1.5px solid #22c55e", color: "#86efac", borderRadius: 12, padding: "12px 16px", fontSize: 14, marginBottom: 12 },
    feedbackBad: { background: "#450a0a", border: "1.5px solid #ef4444", color: "#fca5a5", borderRadius: 12, padding: "12px 16px", fontSize: 14, marginBottom: 12 },
  };

  const hearts_row = <div style={{ display: "flex", gap: 2 }}>{[1,2,3,4,5].map(i => <HeartIcon key={i} filled={i <= hearts} />)}</div>;
  const streak_badge = <div style={{ display: "flex", alignItems: "center", gap: 4, color: "#ef4444", fontWeight: 700, fontSize: 15 }}>🔥 {streak}</div>;

  if (screen === "levelup") return (
    <div style={s.outer}>
      <div style={{ ...s.card, textAlign: "center", padding: 48 }}>
        <div style={{ fontSize: 64, marginBottom: 16 }}>🏆</div>
        <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 32, fontWeight: 900, color: "#facc15", marginBottom: 8 }}>Level {levelIndex}!</div>
        <div style={{ color: "#94a3b8", marginBottom: 32 }}>Du er rykket op. Fortsæt det gode arbejde.</div>
        <button style={s.btnPrimary} onClick={() => setScreen("home")}>Fortsæt</button>
      </div>
    </div>
  );

  if (screen === "home") return (
    <div style={s.outer}>
      <div style={s.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 32 }}>
          <div>
            <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 26, fontWeight: 900, color: "#f1f5f9", letterSpacing: -1 }}>Deutsch<span style={{ color: "#3b82f6" }}>Trainer</span></div>
            <div style={{ color: "#64748b", fontSize: 13 }}>Hverdagstysk med AI</div>
          </div>
          <div style={{ display: "flex", gap: 12, alignItems: "center" }}>{streak_badge}{hearts_row}</div>
        </div>

        <div style={{ marginBottom: 28 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#64748b", marginBottom: 6 }}>
            <span style={{ fontWeight: 700, color: "#94a3b8" }}>Level {levelIndex}</span>
            <span>{xp % XP_LEVEL_UP} / {XP_LEVEL_UP} XP</span>
          </div>
          <ProgressBar value={xp % XP_LEVEL_UP} max={XP_LEVEL_UP} color="#3b82f6" />
        </div>

        {sessionTotal > 0 && (
          <div style={{ display: "flex", gap: 12, marginBottom: 28 }}>
            {[{label:"Øvelser",val:sessionTotal},{label:"Korrekte",val:sessionCorrect,color:"#22c55e"},{label:"Præcision",val:accuracy+"%",color:accuracy>70?"#22c55e":"#f59e0b"}].map(stat => (
              <div key={stat.label} style={{ flex: 1, background: "#1e293b", borderRadius: 12, padding: "12px 0", textAlign: "center" }}>
                <div style={{ fontSize: 20, fontWeight: 900, color: stat.color||"#f1f5f9", fontFamily: "'Syne', sans-serif" }}>{stat.val}</div>
                <div style={{ fontSize: 11, color: "#64748b", marginTop: 2 }}>{stat.label}</div>
              </div>
            ))}
          </div>
        )}

        <div style={{ marginBottom: 28 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#64748b", marginBottom: 10, textTransform: "uppercase", letterSpacing: 1 }}>Sværhedsgrad</div>
          <div style={{ display: "flex", gap: 8 }}>
            {LEVELS.map(l => (
              <button key={l.id} onClick={() => setLevel(l.id)} style={{
                flex: 1, padding: "10px 4px", borderRadius: 10, border: "2px solid",
                borderColor: level === l.id ? "#3b82f6" : "#1e293b",
                background: level === l.id ? "#1d3557" : "#1e293b",
                color: level === l.id ? "#93c5fd" : "#475569",
                fontWeight: 700, fontSize: 13, cursor: "pointer", fontFamily: "'Syne', sans-serif",
              }}>
                <div>{l.id}</div>
                <div style={{ fontSize: 10, fontWeight: 400, marginTop: 2 }}>{l.desc}</div>
              </button>
            ))}
          </div>
        </div>

        <button style={{ ...s.btnPrimary, marginBottom: hearts === 0 ? 10 : 0 }} onClick={fetchExercise} disabled={hearts === 0}>
          {hearts === 0 ? "❤️ Ingen liv tilbage" : "Start øvelse →"}
        </button>
        {hearts === 0 && <button style={s.btnSecondary} onClick={() => setHearts(5)}>Genopfyld liv</button>}
      </div>
    </div>
  );

  // Options renderer for mc + error_correction
  function OptionsButtons() {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
        {exercise.options?.map((opt, i) => {
          let bg = "#1e293b", border = "#334155", color = "#cbd5e1";
          if (revealed) {
            if (i === exercise.correct) { bg = "#14532d"; border = "#22c55e"; color = "#86efac"; }
            else if (i === selected) { bg = "#450a0a"; border = "#ef4444"; color = "#fca5a5"; }
          } else if (selected === i) { bg = "#1e3a5f"; border = "#3b82f6"; color = "#93c5fd"; }
          return (
            <button key={i} disabled={revealed} onClick={() => setSelected(i)}
              style={{ background: bg, border: `2px solid ${border}`, color, borderRadius: 12, padding: "13px 16px", textAlign: "left", fontSize: 15, fontWeight: 600, cursor: revealed ? "default" : "pointer" }}>
              <span style={{ opacity: 0.5, marginRight: 8 }}>{["A","B","C","D"][i]}</span>{opt}
            </button>
          );
        })}
      </div>
    );
  }

  return (
    <div style={s.outer}>
      <XPBurst show={showXP} />
      <div style={s.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
          <button style={s.btnGhost} onClick={() => setScreen("home")}>← Tilbage</button>
          {hearts_row}
          <div style={{ display: "flex", alignItems: "center", gap: 4, color: "#facc15", fontWeight: 700, fontSize: 14 }}>🔥 {streak}</div>
        </div>

        {loading && <LoadingDots />}

        {exercise && !exercise.error && (
          <>
            <div style={{ marginBottom: 16, display: "flex", gap: 8, flexWrap: "wrap" }}>
              {exercise.topic && <span style={{ background: "#1e3a5f", color: "#60a5fa", fontSize: 12, fontWeight: 700, padding: "4px 12px", borderRadius: 99 }}>{exercise.topic}</span>}
              {exercise.type === "pronunciation" && <span style={{ background: "#1a2e1a", color: "#86efac", fontSize: 12, fontWeight: 700, padding: "4px 12px", borderRadius: 99 }}>🎤 Udtale</span>}
            </div>

            {exercise.type === "multiple_choice" && (
              <>
                <div style={{ fontSize: 12, color: "#475569", marginBottom: 8, fontWeight: 600, textTransform: "uppercase", letterSpacing: 1 }}>Vælg det rigtige svar</div>
                <div style={{ background: "#1e293b", borderRadius: 14, padding: 20, marginBottom: 20, fontSize: 18, fontWeight: 700, color: "#f1f5f9", lineHeight: 1.5, fontFamily: "'Syne', sans-serif" }}>{exercise.question}</div>
                <OptionsButtons />
                {feedback === "correct" && <div style={s.feedbackGood}>✓ Korrekt!</div>}
                {feedback === "wrong" && <div style={s.feedbackBad}>✗ Forkert.</div>}
                {!revealed
                  ? <button style={{ ...s.btnPrimary, opacity: selected === null ? 0.4 : 1 }} onClick={checkAnswer} disabled={selected === null}>Tjek svar</button>
                  : <><div style={{ background: "#0f172a", borderRadius: 12, padding: 14, fontSize: 13, color: "#94a3b8", borderLeft: "3px solid #3b82f6", marginBottom: 12 }}>💬 {exercise.explanation}</div><button style={s.btnPrimary} onClick={fetchExercise}>Næste øvelse →</button></>
                }
              </>
            )}

            {exercise.type === "error_correction" && (
              <>
                <div style={{ fontSize: 12, color: "#475569", marginBottom: 8, fontWeight: 600, textTransform: "uppercase", letterSpacing: 1 }}>Ret fejlen</div>
                <div style={{ background: "#1e293b", borderRadius: 14, padding: 20, marginBottom: 20, fontSize: 18, fontWeight: 700, color: "#fca5a5", fontStyle: "italic", lineHeight: 1.5, fontFamily: "'Syne', sans-serif" }}>{exercise.wrong}</div>
                <OptionsButtons />
                {feedback === "correct" && <div style={s.feedbackGood}>✓ Korrekt!</div>}
                {feedback === "wrong" && <div style={s.feedbackBad}>✗ Forkert.</div>}
                {!revealed
                  ? <button style={{ ...s.btnPrimary, opacity: selected === null ? 0.4 : 1 }} onClick={checkAnswer} disabled={selected === null}>Tjek svar</button>
                  : <><div style={{ background: "#0f172a", borderRadius: 12, padding: 14, fontSize: 13, color: "#94a3b8", borderLeft: "3px solid #3b82f6", marginBottom: 12 }}>💬 {exercise.explanation}</div><button style={s.btnPrimary} onClick={fetchExercise}>Næste øvelse →</button></>
                }
              </>
            )}

            {exercise.type === "pronunciation" && (
              <>
                <PronunciationExercise exercise={exercise} onCorrect={handlePronCorrect} onWrong={handlePronWrong} />
                {pronDone && (
                  <>
                    {exercise.tip && <div style={{ marginTop: 16, background: "#0f172a", borderRadius: 12, padding: 14, fontSize: 13, color: "#94a3b8", borderLeft: "3px solid #3b82f6" }}>💬 {exercise.tip}</div>}
                    <button style={{ ...s.btnPrimary, marginTop: 16 }} onClick={fetchExercise}>Næste øvelse →</button>
                  </>
                )}
              </>
            )}
          </>
        )}

        {exercise?.error && (
          <div style={{ color: "#fca5a5", textAlign: "center", padding: 32 }}>
            Noget gik galt. <button style={s.btnGhost} onClick={fetchExercise}>Prøv igen</button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
